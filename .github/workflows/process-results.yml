name: Process race result

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: >-
      (github.event_name == 'issues' &&
      (startsWith(github.event.issue.title, '[Race result]') ||
      startsWith(github.event.issue.title, '[Group draw]') ||
      startsWith(github.event.issue.title, '[Group started]') ||
      startsWith(github.event.issue.title, '[Team roster]') ||
      startsWith(github.event.issue.title, '[Tournament reset]'))) ||
      (github.event_name == 'issue_comment' &&
      startsWith(github.event.issue.title, '[Tournament reset]') &&
      github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted tournament code
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Process official race submission
        run: node scripts/process-result.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
